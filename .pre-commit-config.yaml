repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
        args: [ --unsafe ]
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.13.9
    hooks:
      - id: commitizen
        stages: [commit-msg]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.15.6
    hooks:
      # Run the linter.
      - id: ruff
        args: [ --fix, --extend-select=I ]
      # Run the formatter.
      - id: ruff-format
exclude: |
    (?x)(
        ^output/|
        ^fonts/|
        ^charts/|
        ^old/|
        ^tests/test_files/|
        ^src/pysc2/|
        ^src/s2client-proto/|
        ^src/pysc2_converter_external/proto/
    )
