[project]
name = "pysc2-converter-external"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kaszanas", email = "34846245+Kaszanas@users.noreply.github.com" }
]
requires-python = ">=3.10"
dependencies = [
    "click>=8.3.1",
    "grpcio>=1.78.0",
    "protobuf<3.21.0",
    "pysc2>=4.0.0",
    "s2clientprotocol>=5.0.15.95299.0",
    "s2protocol>=5.0.15.95299.0",
]


[dependency-groups]
dev = [
    "commitizen>=4.13.9",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "ruff>=0.15.6",
]

[tool.uv.sources]
s2protocol = { git = "https://github.com/Kaszanas/s2protocol" }

[tool.ruff]
extend-exclude = ["src/pysc2", "src/pysc2_converter_external/proto", "src/sc2client-proto", "tests/test_files"]
lint.extend-select = ["I"]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/pysc2_converter_external",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/pysc2_converter_external",
]
