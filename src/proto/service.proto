// Import from pysc2 protos the definitions for the message that is required:

syntax = "proto2";

// Converter protocol file from pysc2:
import "pysc2/env/converter/proto/converter.proto";

message ConfigureRequest {
    required pysc2.ConverterSettings settings = 1;
    required pysc2.EnvironmentInfo environment_info = 2;
}

message ConfigureResponse {
  // Whether the converter was successfully configured.
  required bool success = 1;
  required uint64 session_id = 2;
}

message RandomNumberResponse {
  // A random number generated by the converter.
  required int32 random_number = 1;
}

message Empty {}


message ObservationSpec {
    // A map of strings (feature names) to serialized `dm_env_rpc.v1.TensorSpec` bytes
    map<string, bytes> specs = 1;
}

message ActionSpec {
    // A map of strings (action names) to serialized `dm_env_rpc.v1.TensorSpec` bytes
    map<string, bytes> specs = 1;
}

// Represents the dynamically sized output data per frame
message ConvertedObservation {
    // A map of strings (feature names) to serialized `dm_env_rpc.v1.Tensor` bytes
    map<string, bytes> tensors = 1;
}

message ActionRequest {
    // A map of strings (action names) to serialized `dm_env_rpc.v1.Tensor` bytes
    map<string, bytes> tensors = 1;
}

service ExternalConverterService {
    rpc ConfigureConverter(ConfigureRequest) returns (ConfigureResponse) {}

    rpc GetObservationSpec(Empty) returns (ObservationSpec) {}

    rpc GetActionSpec(Empty) returns (ActionSpec) {}

    rpc ConvertObservation(pysc2.Observation) returns (ConvertedObservation) {}

    rpc ConvertAction(ActionRequest) returns (pysc2.Action) {}
}
